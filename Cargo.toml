[package]
name = "storage_manager"
version = "0.2.0"
edition = "2024"
default-run = "storage_manager"
description = "A lightweight Storage Manager for Object Releational Database written in Rust"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = { version = "0.61", features = ["serde"] }
regex = "1"
sysinfo = "0.33"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]