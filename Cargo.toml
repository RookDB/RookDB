[package]
name = "storage_manager"
version = "0.2.1"
edition = "2024"
description = "A lightweight Storage Manager for Object Releational Database written in Rust"
license = "Apache-2.0"

[dependencies]
rook-ast = { path = "../rook-ast" }
sqlparser = { version = "0.61.0", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
sysinfo = "0.33"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
rook-parser = { path = "../rook-parser" }